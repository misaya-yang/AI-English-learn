<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#788596" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>VocabDaily</title>
    <script>
      (() => {
        try {
          const key = 'vocabdaily-theme';
          const versionKey = 'vocabdaily-theme-version';
          const currentVersion = '2026-06-workbench-light';
          const previousVersion = localStorage.getItem(versionKey);
          const storedValue = localStorage.getItem(key);
          if (previousVersion !== currentVersion && storedValue && storedValue !== 'light') {
            localStorage.setItem(key, 'light');
          }
          localStorage.setItem(versionKey, currentVersion);
          const stored = localStorage.getItem(key) || 'light';
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const requested = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'light';
          const resolved = requested === 'system' ? (prefersDark ? 'dark' : 'light') : requested;
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(resolved === 'dark' ? 'dark' : 'light');
          document.documentElement.style.colorScheme = resolved === 'dark' ? 'dark' : 'light';
        } catch {
          document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden" onfocus="this.style.cssText='position:fixed;top:1rem;left:1rem;z-index:100;padding:0.5rem 1rem;background:#36577a;color:#fff;border-radius:0.375rem;outline:none;box-shadow:0 2px 12px rgba(20,30,45,.18)'" onblur="this.style.cssText='position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden'">Skip to content</a>
    <div id="root"></div>
    <div id="aria-live-region" aria-live="polite" aria-atomic="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
